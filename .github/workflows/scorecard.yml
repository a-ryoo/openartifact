name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 2" # weekly, Tuesday 04:17 UTC
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: [self-hosted, Linux, X64, openartifact-release]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      actions: read # Scorecard reads workflow metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # OpenSSF publication requires a GitHub-hosted runner.
          publish_results: false

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
